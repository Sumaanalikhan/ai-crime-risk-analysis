name: CrimeGuard CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Frontend (React + Vite) Build & Route Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for legacy /safe-routes links
        run: |
          if grep -rn "/safe-routes" src/pages src/components; then
            echo "Found legacy /safe-routes reference!"
            exit 1
          fi

      - name: Build production bundle
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build

  backend-verify:
    name: Backend (Node/Express) Syntax & Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify server and route syntax
        run: |
          node --check server.js
          for file in routes/*.js; do
            node --check "$file"
          done

  ai-service-verify:
    name: AI Microservice (Python) Syntax & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & syntax-check
        run: |
          AI_DIR=$(find . -maxdepth 2 -name "requirements.txt" -not -path "./frontend/*" -not -path "./backend/*" -exec dirname {} \; | head -n 1)
          if [ -n "$AI_DIR" ]; then
            echo "Detected Python service in $AI_DIR"
            pip install --upgrade pip
            pip install -r "$AI_DIR/requirements.txt"
            find "$AI_DIR" -name "*.py" -exec python -m py_compile {} +
          else
            echo "No separate Python requirements.txt detected; checking any root/service .py files"
            find . -maxdepth 3 -name "*.py" -not -path "./.git/*" -exec python -m py_compile {} +
          fi